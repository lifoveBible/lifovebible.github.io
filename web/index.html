<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Lifove Bible</title>
  <!-- 설치(홈 화면에 추가)용. 위쪽 막대 색(--bar)과 맞춘다 -->
  <meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- 읽기 화면. 문구는 js/strings.js에서 채운다.
       책·장 바는 앱처럼 아래가 기본이고 메뉴에서 위로 바꾼다(html에 bar-top). 위치는 CSS order로 정한다 -->
  <header class="bar">
    <!-- 앱 verselist.xml처럼 책·장·절 단추를 따로 둔다. 절 단추는 맨 위 절과 마지막 절 번호를 두 줄로(어디까지 읽었는지).
         글자 크기 가-/가+는 본문화면설정으로 옮겼다 -->
    <div class="nav">
      <button id="bookBtn" class="ref"></button>
      <button id="chapterBtn" class="chap"></button>
      <button id="verseBtn" class="verse"><span id="verseNow"></span><span id="verseLast"></span></button>
      <!-- 읽음 표시(앱 verselist.xml의 read_check). 고른 역본 모두 읽었으면 체크된 채로 보인다 -->
      <label class="read-check"><input type="checkbox" id="readCheck"></label>
    </div>
    <div class="tools">
      <button id="searchBtn" class="icon">🔍</button>
    </div>
    <!-- 앱의 메뉴처럼 오른쪽 위 끝. 폰 폭에서도 첫 줄 끝에 오게 CSS order로 자리를 정한다 -->
    <button id="menuBtn" class="icon" aria-haspopup="menu">☰</button>
  </header>

  <main>
    <p id="status" role="status"></p>
    <!-- 고른 역본이 없을 때(받은 것을 다 지웠을 때) 보인다 -->
    <p id="emptyBox" hidden><button id="emptyDownload" class="primary"></button></p>
    <ol id="verses"></ol>
  </main>

  <!-- 본문 위 이동 버튼. 앱 verselist.xml의 navigationbar_layout(장 ‹ ›, 화면 ˄ ˅, 최근목록 ↶ ↷)에 해당.
       아이콘은 앱 ic_nav_*.xml과 같은 경로(Material Icons, Apache License 2.0). 어느 쌍을 보일지, 어디에 둘지(data-pos)는 본문화면설정 -->
  <nav id="sideNav" class="side-nav">
    <button id="navPrevCh" data-group="chapter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41,7.41L14,6l-6,6 6,6 1.41,-1.41L10.83,12z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
    <button id="navNextCh" data-group="chapter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10,6L8.59,7.41 13.17,12l-4.58,4.59L10,18l6,-6z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
    <button id="navUp" data-group="screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41,15.41L12,10.83l4.59,4.58L18,14l-6,-6 -6,6z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
    <button id="navDown" data-group="screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41,8.59L12,13.17l4.59,-4.58L18,10l-6,6 -6,-6 1.41,-1.41z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
    <button id="navBack" data-group="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5,8c-2.65,0 -5.05,0.99 -6.9,2.6L2,7v9h9l-3.62,-3.62c1.39,-1.16 3.16,-1.88 5.12,-1.88 3.54,0 6.55,2.31 7.6,5.5l2.37,-0.78C21.08,11.03 17.15,8 12.5,8z" fill="currentColor" transform="translate(12 12) scale(0.75) translate(-12 -12)"/></svg></button>
    <button id="navForward" data-group="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.4,10.6C16.55,8.99 14.15,8 11.5,8c-4.65,0 -8.58,3.03 -9.96,7.22L3.9,16c1.05,-3.19 4.05,-5.5 7.6,-5.5 1.95,0 3.73,0.72 5.12,1.88L13,16h9V7l-3.6,3.6z" fill="currentColor" transform="translate(12 12) scale(0.75) translate(-12 -12)"/></svg></button>
  </nav>
  <!-- 잠깐 보이는 알림(앱의 Toast). 예: 아래 버튼을 한 번 더 누르면 다음 장 -->
  <div id="toast" role="status" hidden></div>
  <!-- 고른 절 동작(앱의 절 꾹 누르기 메뉴: 선택한 절 복사·전송, 선택 해제). 절을 하나라도 고르면 책·장 바 옆에 보인다 -->
  <div id="selBar" hidden>
    <span id="selCount"></span>
    <button id="selHl"></button>
    <button id="selHlOff"></button>
    <button id="selMemo"></button>
    <button id="selCopy"></button>
    <button id="selShare"></button>
    <button id="selClear" class="icon">✕</button>
  </div>

  <!-- 메모 입력판. 앱의 MemoPanel(본문 아래에 붙어 그 절을 보며 쓴다. 저장·닫기·삭제)에 해당.
       창(dialog)으로 하지 않은 까닭: 본문을 가리지 않고 앞뒤 절을 스크롤해 볼 수 있게(앱이 대화상자를 버린 까닭과 같다) -->
  <section id="memoPanel" hidden>
    <div class="memo-head">
      <!-- 메모책이 둘 이상이면 "참조 · 메모책 ▾"로 보이고 눌러서 바꾼다(앱 MemoPanel.bind). 하나뿐이면 꺼 두어 글자처럼 -->
      <button id="memoTitle" type="button" class="book-pick" disabled></button>
      <!-- 입력 방식 아이콘: 저장하면 다음 절로, 엔터를 누르면 저장. 굵으면 켜짐, 눌러서 바로 바꾼다(앱 PANEL_OPTIONS).
           건너뛰기·장 끝에서 다음 장은 세부 설정이라 메모책 고치기 창에서만(앱과 같다) -->
      <button id="memoOpt0" type="button" class="memo-opt icon" aria-pressed="false"></button>
      <button id="memoOpt3" type="button" class="memo-opt icon" aria-pressed="false"></button>
    </div>
    <textarea id="memoText" rows="3"></textarea>
    <div class="memo-btns">
      <button id="memoDel"></button>
      <span class="spacer"></span>
      <button id="memoClose"></button>
      <button id="memoSave" class="primary"></button>
    </div>
  </section>
  <!-- 바뀐 메모를 저장할지 묻기(앱 MemoPanel.closeOrAsk: 저장 / 저장 안 함 / 취소) -->
  <dialog id="memoAsk" class="ask">
    <p id="memoAskText"></p>
    <div class="ask-btns">
      <button id="memoAskCancel"></button>
      <button id="memoAskDiscard"></button>
      <button id="memoAskSave" class="primary"></button>
    </div>
  </dialog>

  <!-- 책 → 장 고르기. 앱의 DialogBookSelectionTable, DialogChapterSelectionTable에 해당 -->
  <dialog id="picker">
    <div class="picker-head">
      <button id="pickerBack" class="link" hidden></button>
      <h2 id="pickerTitle"></h2>
      <button id="pickerClose" class="icon">✕</button>
    </div>
    <div id="pickerBody"></div>
  </dialog>

  <!-- 역본 고르기. 앱의 다른성경보기(Util SEL_ONE_VER, 하나 고르기)와 역본대조보기(SEL_VER, 여러 개면 대조 보기)를
       한 창으로 쓴다. 모드에 따라 라디오/체크 상자 -->
  <dialog id="verPicker">
    <div class="picker-head">
      <h2 id="verTitle"></h2>
      <button id="verClose" class="icon">✕</button>
    </div>
    <div id="verBody">
      <p id="verHint" class="hint"></p>
      <div id="verList"></div>
      <p id="verEmpty" class="hint" hidden></p>
      <!-- 받은 역본만 보이므로 더 받으러 가는 길을 둔다 -->
      <p class="more-link"><button id="verDownload" class="link"></button></p>
    </div>
    <div class="picker-foot">
      <label class="check"><input type="checkbox" id="oneColumn"> <span id="oneColumnLabel"></span></label>
      <span class="spacer"></span>
      <button id="verCancel"></button>
      <button id="verOk" class="primary"></button>
    </div>
  </dialog>

  <!-- 메뉴. 앱의 옵션 메뉴에 해당. 위쪽 ☰ 아래에 붙여 보인다 -->
  <dialog id="menu" class="menu">
    <!-- 순서는 앱 메뉴를 따른다(검색, 다른성경보기, 역본대조보기 … 설정의 성경다운로드) -->
    <button id="menuAddBookmark"></button>
    <button id="menuSearch"></button>
    <button id="menuOneVersion"></button>
    <button id="menuVersions"></button>
    <button id="menuBookmarks"></button>
    <button id="menuHighlights"></button>
    <button id="menuMemoList"></button>
    <button id="menuMemoToggle" hidden></button>
    <button id="menuStats"></button>
    <button id="menuDownload"></button>
    <button id="menuImport"></button>
    <button id="menuBackup"></button>
    <button id="menuSettings"></button>
    <button id="menuHelp"></button>
  </dialog>

  <!-- 책갈피. 앱의 HistoryList(책갈피: 최근 추가순, 누르면 그 절로, 꾹 눌러 삭제)에 해당 -->
  <dialog id="bmBox">
    <div class="picker-head">
      <h2><span id="bmTitle"></span> <span id="bmCount" class="count"></span></h2>
      <button id="bmClose" class="icon">✕</button>
    </div>
    <p id="bmEmpty" class="empty" hidden></p>
    <ul id="bmList" class="scroll hl-list bm-list"></ul>
    <div class="picker-foot">
      <p id="bmNote" class="foot-status" role="status" hidden></p>
    </div>
  </dialog>

  <!-- 나의형광펜목록. 앱의 UnderlineList(정렬 바꾸기, 누르면 그 절로, 형광펜 보내기, 전체삭제)에 해당 -->
  <dialog id="hlBox">
    <div class="picker-head">
      <h2><span id="hlTitle"></span> <span id="hlCount" class="count"></span></h2>
      <button id="hlClose" class="icon">✕</button>
    </div>
    <div class="stats-head">
      <select id="hlOrder"></select>
    </div>
    <p id="hlEmpty" class="empty" hidden></p>
    <ul id="hlList" class="scroll hl-list"></ul>
    <div class="picker-foot">
      <!-- 창이 알림(#toast)을 가리므로 결과는 여기에 -->
      <p id="hlNote" class="foot-status" role="status" hidden></p>
      <button id="hlDeleteAll"></button>
      <span class="spacer"></span>
      <button id="hlSend"></button>
    </div>
  </dialog>

  <!-- 나의메모목록. 앱의 MemoList(검색, 정렬 바꾸기, 누르면 그 절로, 메모보내기, 전체삭제)에 해당 -->
  <dialog id="mlBox">
    <div class="picker-head">
      <!-- 메모책이 둘 이상이면 제목 자리에 지금 메모책 이름(▾), 눌러서 바꾼다(앱 MemoList.updateHeader) -->
      <h2><button id="mlTitle" type="button" class="book-pick" disabled></button> <span id="mlCount" class="count"></span></h2>
      <button id="mlClose" class="icon">✕</button>
    </div>
    <div class="stats-head">
      <!-- type=search는 브라우저가 Esc로 지우는 등 제멋대로라 text로 두고 지우기 단추를 직접 둔다 -->
      <span class="ml-search">
        <input id="mlSearch" type="text" enterkeyhint="search" autocomplete="off">
        <button id="mlSearchClear" class="icon" hidden>✕</button>
      </span>
      <select id="mlOrder"></select>
    </div>
    <p id="mlEmpty" class="empty" hidden></p>
    <ul id="mlList" class="scroll hl-list ml-list"></ul>
    <div class="picker-foot">
      <p id="mlNote" class="foot-status" role="status" hidden></p>
      <button id="mlDeleteAll"></button>
      <span class="spacer"></span>
      <button id="mlSend"></button>
    </div>
  </dialog>

  <!-- 메모책 고르기. 앱 MemoBookList.pick(하나 고르기 + [메모책 관리]) -->
  <dialog id="mbPick" class="ask">
    <h2 id="mbPickTitle" class="ask-title"></h2>
    <div id="mbPickList" class="mb-pick"></div>
    <div class="ask-btns">
      <button id="mbPickManage"></button>
      <span class="spacer"></span>
      <button id="mbPickCancel"></button>
    </div>
  </dialog>

  <!-- 메모책 관리. 앱 MemoBookList(설정 > 메모 설정 > 메모책): 누르면 고치기, 맨 아래 "+ 메모책 추가".
       앱은 꾹 눌러 위로·아래로·삭제인데, 웹은 줄마다 단추로(형광펜 목록의 🗑처럼) -->
  <dialog id="mbBox">
    <div class="picker-head">
      <h2 id="mbTitle"></h2>
      <button id="mbClose" class="icon">✕</button>
    </div>
    <ul id="mbList" class="scroll hl-list mb-list"></ul>
    <div class="picker-foot">
      <p id="mbNote" class="foot-status" role="status" hidden></p>
    </div>
  </dialog>

  <!-- 메모책 추가·고치기. 앱 MemoBookList.showEditDialog(이름과 입력 방식 4가지) -->
  <dialog id="mbEdit" class="ask">
    <form id="mbEditForm" method="dialog">
      <h2 id="mbEditTitle" class="ask-title"></h2>
      <input id="mbName" type="text" autocomplete="off" enterkeyhint="done" maxlength="100">
      <div id="mbOpts" class="mb-opts"></div>
      <div class="ask-btns">
        <button id="mbEditDel" type="button"></button>
        <span class="spacer"></span>
        <button id="mbEditCancel" type="button"></button>
        <button id="mbEditSave" type="submit" class="primary"></button>
      </div>
    </form>
  </dialog>

  <!-- 성경읽기통계. 앱의 ReadCheckTable(역본 고르기 + 전체 %, 전체·구약·신약과 66권의 읽은 장·막대)에 해당 -->
  <dialog id="statsBox">
    <div class="picker-head">
      <h2 id="statsTitle"></h2>
      <button id="statsClose" class="icon">✕</button>
    </div>
    <div class="stats-head">
      <select id="statsVer"></select>
      <output id="statsAll"></output>
    </div>
    <ul id="statsList" class="scroll stats"></ul>
    <div class="picker-foot">
      <!-- 창이 알림(#toast)을 가리므로 초기화 결과는 여기에 -->
      <p id="statsNote" class="foot-status" role="status" hidden></p>
      <button id="statsReset"></button>
      <span class="spacer"></span>
      <button id="statsDone"></button>
    </div>
  </dialog>

  <!-- 도움말. 앱의 메뉴 > 도움말에 해당. 내용은 help/<언어>.html을 불러와 넣는다(오프라인에서도 보이게 앱 파일로 캐시) -->
  <dialog id="helpBox">
    <div class="picker-head">
      <h2 id="helpTitle"></h2>
      <button id="helpClose" class="icon">✕</button>
    </div>
    <div id="helpBody" class="scroll help"></div>
  </dialog>

  <!-- 본문화면설정. 앱 설정의 "본문화면설정" 화면(화면 구성, 색)에 해당. 앱처럼 바꾸면 바로 적용(확인 단추 없음) -->
  <dialog id="settingsBox">
    <div class="picker-head">
      <h2 id="settingsTitle"></h2>
      <button id="settingsClose" class="icon">✕</button>
    </div>
    <div class="scroll settings">
      <h3 id="groupScreen"></h3>
      <label class="setting"><input type="checkbox" id="setBarBottom"> <span id="setBarBottomLabel"></span></label>
      <label class="setting"><input type="checkbox" id="setOneColumn">
        <span><span id="setOneColumnLabel"></span><small id="setOneColumnHint"></small></span></label>
      <label class="setting"><input type="checkbox" id="setVerName">
        <span><span id="setVerNameLabel"></span><small id="setVerNameHint"></small></span></label>
      <!-- 앱은 "글자"(글자 크기)와 "색"이 따로지만, 미리보기 하나로 크기와 색을 함께 보게 한 묶음으로 -->
      <h3 id="groupColors"></h3>
      <div class="setting color">
        <span id="fontSizeLabel"></span>
        <span class="stepper" role="group" id="fontGroup">
          <button id="smaller" class="icon">−</button>
          <output id="fontSizeNow"></output>
          <button id="larger" class="icon">+</button>
        </span>
      </div>
      <label class="setting color"><span id="fontColorLabel"></span><input type="color" id="fontColor"></label>
      <label class="setting color"><span id="bgColorLabel"></span><input type="color" id="bgColor"></label>
      <div id="colorPresets" class="presets"></div>
      <p id="colorSample" class="color-sample"></p>
      <button id="colorReset"></button>
      <h3 id="groupNav"></h3>
      <label class="setting stack"><span><span id="navBarLabel"></span><small id="navBarHint"></small></span>
        <select id="setNavBar"></select></label>
      <label class="setting stack"><span id="navPosLabel"></span><select id="setNavPos"></select></label>
      <label class="setting stack"><span id="navUnitLabel"></span><select id="setNavUnit"></select></label>
      <label class="setting"><input type="checkbox" id="setSwipe">
        <span><span id="setSwipeLabel"></span><small id="setSwipeHint"></small></span></label>
      <!-- 앱은 설정 > 메모 설정 > 메모책. 웹은 설정 화면이 이것 하나라 여기 묶음으로 -->
      <h3 id="groupMemo"></h3>
      <button id="setMemoBooks" type="button" class="setting nav">
        <span><span id="setMemoBooksLabel"></span><small id="setMemoBooksHint"></small></span></button>
    </div>
  </dialog>

  <!-- 성경다운로드. 앱의 AddBibleData(받을 역본을 체크해서 한꺼번에 받기)에 해당.
       받은 역본은 "받음"과 지우기(앱은 설정의 데이터 관리에서 지운다) -->
  <dialog id="dlBox">
    <div class="picker-head">
      <h2 id="dlTitle"></h2>
      <button id="dlClose" class="icon">✕</button>
    </div>
    <div id="dlBody" class="scroll">
      <p id="dlHint" class="hint"></p>
      <p id="dlNote" class="hint error" hidden></p>
      <div id="dlList"></div>
    </div>
    <div class="picker-foot">
      <p id="dlStatus" class="foot-status" role="status"></p>
      <span class="spacer"></span>
      <button id="dlCancel"></button>
      <button id="dlGo" class="primary"></button>
    </div>
  </dialog>

  <!-- 성경 파일 넣기(가지고 있는 .lfa/.bdf). 폴더 고르기는 webkitdirectory(아이폰 사파리는 안 될 수 있다) -->
  <dialog id="importBox">
    <div class="picker-head">
      <h2 id="importTitle"></h2>
      <button id="importClose" class="icon">✕</button>
    </div>
    <div id="importBody" class="scroll">
      <p id="importHint" class="hint"></p>
      <div class="import">
        <button id="importFilesBtn"></button>
        <button id="importFolderBtn"></button>
        <input type="file" id="importFiles" accept=".lfa,.bdf" multiple hidden>
        <input type="file" id="importFolder" webkitdirectory multiple hidden>
      </div>
      <progress id="importProgress" hidden></progress>
      <p id="importNote" class="hint" role="status" hidden></p>
      <h3 id="localTitle"></h3>
      <ul id="localList" class="ver-list"></ul>
      <p id="localEmpty" class="hint" hidden></p>
    </div>
  </dialog>

  <!-- 데이터 백업·복구. 앱의 설정 > 데이터 백업 / 데이터 복구에 해당. 파일은 앱과 같은 SQLite(DB 12)라 서로 주고받는다 -->
  <dialog id="backupBox">
    <div class="picker-head">
      <h2 id="backupTitle"></h2>
      <button id="backupClose" class="icon">✕</button>
    </div>
    <div id="backupBody" class="scroll">
      <h3 id="backupSaveTitle"></h3>
      <p id="backupSaveHint" class="hint"></p>
      <p id="backupLast" class="hint backup-last"></p>
      <div class="import">
        <button id="backupRun"></button>
      </div>
      <!-- 다른 기기의 앱·웹에서 복구해 이어 쓸 수 있다는 안내. 단추를 밀어내지 않게 단추 아래에 -->
      <p id="backupMoveHint" class="hint"></p>
      <!-- 기록 보관 안내: 웹 기록은 이 브라우저에만 있어 사라질 수 있다. 백업은 사용자가 관리한다(사용자와 정함).
           백업 단추 아래에 둔다: 위에 두면 폰에서 단추가 화면 밖으로 밀려, 알림 바의 [백업]으로 들어온 사람이 찾기 어렵다 -->
      <div class="backup-notice">
        <h3 id="backupNoticeTitle"></h3>
        <p id="backupNotice1"></p>
        <p id="backupNotice2"></p>
        <p id="backupNotice3"></p>
      </div>
      <h3 id="restoreTitle"></h3>
      <p id="restoreHint" class="hint"></p>
      <div class="import">
        <button id="restoreRun"></button>
        <!-- accept를 두지 않는다: 앱 7.4.6 이하 백업은 확장자 없는 'lifovebible'이라 .db로 거르면 고를 수 없다 -->
        <input type="file" id="restoreFile" hidden>
      </div>
    </div>
    <div class="picker-foot">
      <!-- 창이 알림(#toast)을 가리므로 결과는 여기에 -->
      <p id="backupNote" class="foot-status" role="status" hidden></p>
      <span class="spacer"></span>
      <button id="backupDone"></button>
    </div>
  </dialog>

  <!-- 복구 방식 고르기(앱 Settings의 복구 창: 합치기(추천) / 바꾸기 + [복구 실행]) -->
  <dialog id="restoreAsk" class="ask">
    <h2 id="restoreAskTitle" class="ask-title"></h2>
    <p id="restoreAskFile" class="hint"></p>
    <div class="restore-modes">
      <label class="restore-mode"><input type="radio" name="restoreMode" value="merge" checked><span id="restoreMerge"></span></label>
      <label class="restore-mode"><input type="radio" name="restoreMode" value="replace"><span id="restoreReplace"></span></label>
    </div>
    <div class="ask-btns">
      <button id="restoreCancel"></button>
      <button id="restoreGo" class="primary"></button>
    </div>
  </dialog>

  <!-- 복구 결과(앱: 요약을 읽고 [확인]을 누르면 메모 고르기로) -->
  <dialog id="restoreResult" class="ask">
    <p id="restoreResultText"></p>
    <div class="ask-btns">
      <button id="restoreResultOk" class="primary"></button>
    </div>
  </dialog>

  <!-- 메모 고르기(앱 MemoConflictDialogs: [이 폰] [백업] [둘 다], 남은 것에도 같게). 글 부분만 스크롤 -->
  <dialog id="conflictBox" class="ask">
    <h2 id="conflictTitle" class="ask-title"></h2>
    <div class="conflict-body">
      <p id="conflictRef" class="conflict-ref"></p>
      <h3 id="conflictLocalHead"></h3>
      <p id="conflictLocal" class="conflict-text"></p>
      <h3 id="conflictBackupHead"></h3>
      <p id="conflictBackup" class="conflict-text"></p>
    </div>
    <label id="conflictRestRow" class="check"><input type="checkbox" id="conflictRest"><span id="conflictRestText"></span></label>
    <div class="conflict-btns">
      <button id="conflictPickLocal"></button>
      <button id="conflictPickBackup"></button>
      <button id="conflictPickBoth"></button>
    </div>
  </dialog>

  <!-- 검색. 앱의 SearchView에 해당(검색어 A·B, 범위). 창을 닫아도 지난 결과는 남는다 -->
  <dialog id="searchBox">
    <div class="picker-head">
      <h2 id="searchTitle"></h2>
      <button id="searchClose" class="icon">✕</button>
    </div>
    <form id="searchForm" class="search-form">
      <div class="search-row">
        <input type="search" id="qA" autofocus enterkeyhint="search">
        <input type="search" id="qB" enterkeyhint="search">
      </div>
      <div class="search-row">
        <select id="searchRange"></select>
        <select id="searchVer"></select>
        <button id="searchGo" type="submit" class="primary"></button>
      </div>
    </form>
    <div id="searchBody">
      <div class="search-status">
        <p id="searchStatus" role="status"></p>
        <button id="searchStop" hidden></button>
      </div>
      <ol id="searchResults"></ol>
      <button id="searchMore" hidden></button>
    </div>
  </dialog>

  <!-- 새 버전을 받아 두었을 때 아래에 보인다(js/pwa.js) -->
  <div id="updateBar" role="status" hidden>
    <span id="updateText"></span>
    <button id="updateLater" hidden></button>
    <button id="updateBtn"></button>
  </div>

  <!-- 성경 파일을 끌어다 놓는 동안 보인다 -->
  <div id="dropOverlay" hidden><p id="dropText"></p></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
